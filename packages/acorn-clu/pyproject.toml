[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "acorn-clu"
version = "0.3.0"
description = "CLU — the natural-language assistant built into ACORN"
requires-python = ">=3.12"
authors = [{ name = "CNMS Low-Dose CryoEM Lab" }]
dependencies = [
    "acorn>=0.3",
    "anthropic>=0.52",
    "openai>=1.0",
]

[project.entry-points."acorn.plugins"]
acorn_llm = "acorn_llm.plugin:LLMPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/acorn_llm"]
