[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "acorn-spatial"
version = "0.3.0"
description = "Clustering, hotspots and nearest-neighbour statistics for ACORN"
requires-python = ">=3.10"
authors = [{ name = "CNMS Low-Dose CryoEM Lab" }]
dependencies = [
    "acorn>=0.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.entry-points."acorn.plugins"]
acorn_spatial = "acorn_spatial.plugin:SpatialPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/acorn_spatial"]
