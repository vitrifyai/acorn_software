[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "acorn-tracking"
version = "0.3.0"
description = "Particle tracking across image series for ACORN"
requires-python = ">=3.10"
authors = [{ name = "CNMS Low-Dose CryoEM Lab" }]
dependencies = [
    "acorn>=0.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
]

[project.entry-points."acorn.plugins"]
acorn_tracking = "acorn_tracking.plugin:TrackingPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/acorn_tracking"]
