[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "acorn"
version = "0.3.0"
description = "Annotate, Curate, Observe, Review, Navigate — microscopy image analysis and annotation suite"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CNMS Low-Dose CryoEM Lab" }]
keywords = ["cryo-em", "dm4", "electron-microscopy", "image-processing", "ncempy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Reading images, annotating them, measuring them and exporting them. Nothing
# here pulls a GPU stack, so a broken CUDA driver can never stop you opening a
# micrograph. Everything heavier is an extra or a separate package.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "ncempy>=1.10",
    "tifffile>=2023.1",
    "Pillow>=10.0",
    "h5py>=3.8",
    "roifile>=2023.5",    # ImageJ ROI import
]

# ── install profiles ──────────────────────────────────────────────────────────
# The first four match the workspaces in the application, so you can install the
# jobs you actually do:
#
#   pip install "acorn[viewer]"     open, contrast, navigate, measure
#   pip install "acorn[annotate]"   the above + SAM / YOLO / UNet
#   pip install "acorn[lab]"        the above + measurements, stats, plots, 3D
#   pip install "acorn[sim]"        the above + TEM / FIB / 4D-STEM simulation
#
[project.optional-dependencies]
# — the Explore workspace —
viewer = ["PyQt6>=6.5", "PyQt6-Qt6>=6.5", "mrcfile>=1.4"]

# — the Annotate workspace: this is the heavy one (torch, CUDA) —
annotate = [
    "acorn[viewer]",
    "sam3>=0.1",                              # SAM 3 (recommended)
    "micro-sam>=1.7",                         # checkpoints tuned for microscopy
    "ultralytics>=8.0",                       # YOLO 11 / v8 / v9 / v10
    "segmentation-models-pytorch>=0.3",       # UNet family
    "torch>=2.0",
]

# — the Analyze and Dataset workspaces —
lab = [
    "acorn[viewer]",
    "acorn-analysis",
    "acorn-plotting",
    "acorn-spatial",
    "acorn-tracking",
    "acorn-3d",
]

# — the Simulate workspace —
sim = ["acorn[viewer]", "acorn-sim"]

# — CLU, the assistant —
clu = ["acorn-clu"]

# — CryoBLOB blob detection (JAX/GPU) —
cryoblob = ["acorn-cryoblob"]

# — publishing datasets —
hub = ["datasets>=2.18", "huggingface_hub>=0.22"]

# — narrower pieces, for people who want exactly one thing —
gui   = ["PyQt6>=6.5", "PyQt6-Qt6>=6.5"]
mrc   = ["mrcfile>=1.4"]
sam   = ["sam3>=0.1", "micro-sam>=1.7"]
sam2  = ["sam2>=1.0"]                         # fallback if sam3 is unavailable
usam  = ["micro-sam>=1.7"]
yolo  = ["ultralytics>=8.0"]
unet  = ["segmentation-models-pytorch>=0.3", "torch>=2.0"]

dev  = ["pytest>=8.0", "pytest-cov", "ruff"]
full = ["acorn[viewer,annotate,lab,sim,clu,cryoblob,hub]"]
all  = ["acorn[full,dev]"]

[project.scripts]
acorn = "acorn.cli.main:main"

[project.gui-scripts]
acorn-gui = "acorn.gui.main_window:launch"

# Plugins register themselves through the "acorn.plugins" entry point from their
# own distribution — see packages/*/pyproject.toml. The core declares none.

# The plugin packages live in this repository and are not published to any index,
# so the profiles above cannot resolve them from PyPI. uv reads the table below and
# takes them from packages/ instead, which makes `uv pip install ".[lab]"` work from
# a checkout. Plain pip ignores it — install those with an explicit path:
#     pip install -e . -e packages/acorn-analysis -e packages/acorn-plotting  ...
[tool.uv.sources]
acorn-analysis = { path = "packages/acorn-analysis", editable = true }
acorn-spatial  = { path = "packages/acorn-spatial",  editable = true }
acorn-plotting = { path = "packages/acorn-plotting", editable = true }
acorn-tracking = { path = "packages/acorn-tracking", editable = true }
acorn-3d       = { path = "packages/acorn-3d",       editable = true }
acorn-clu      = { path = "packages/acorn-clu",      editable = true }
acorn-sim      = { path = "packages/acorn-sim",      editable = true }
acorn-cryoblob = { path = "packages/acorn-cryoblob", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/acorn"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
